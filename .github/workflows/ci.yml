name: Build XakaVisuals V3

on:
  workflow_dispatch:
  push:
    branches:
      - xakavisuals-v3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build current XakaVisuals V3 sources
        run: gradle clean build --no-daemon

      - name: Verify mod metadata and compiled V3 classes
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          echo "Checking $JAR"
          unzip -p "$JAR" fabric.mod.json
          unzip -l "$JAR" | grep -E 'com/xaka/visuals/(ChineseHatRenderer|TargetEspRenderer|TargetInfoHud|MeArmorHud|CrosshairHud|XakaVisualsClient)\.class'
          if unzip -l "$JAR" | grep -q 'dev/xaka/visuals/'; then
            echo "Unexpected legacy dev.xaka.visuals classes found"
            exit 1
          fi

      - name: Upload V3 mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: XakaVisuals-V3-Fabric-1.21.4
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

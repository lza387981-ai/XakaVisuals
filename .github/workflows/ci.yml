name: Build XakaVisuals

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Extract project archive
        run: unzip -q XakaVisuals-phone-build.zip -d source

      - name: Apply mobile rendering fix
        run: cp patches/XakaVisualsScreen.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsScreen.java

      - name: Inspect Java sources for feature work
        run: |
          find source/XakaVisuals/src/main/java -type f -name '*.java' -print
          while IFS= read -r file; do
            echo "===== SOURCE: $file ====="
            sed -n '1,320p' "$file"
          done < <(find source/XakaVisuals/src/main/java -type f -name '*.java' | sort)

      - name: Build Fabric mod
        working-directory: source/XakaVisuals
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: XakaVisuals-Fabric-1.21.4
          path: source/XakaVisuals/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

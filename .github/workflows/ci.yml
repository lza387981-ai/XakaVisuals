name: Build XakaVisuals

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Extract project archive
        run: unzip -q XakaVisuals-phone-build.zip -d source

      - name: Apply mobile rendering fix
        run: cp patches/XakaVisualsScreen.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsScreen.java

      - name: Inspect project configuration
        run: |
          echo "===== BUILD FILE ====="
          sed -n '1,260p' source/XakaVisuals/build.gradle
          echo "===== RESOURCE FILE LIST ====="
          find source/XakaVisuals/src/main/resources -maxdepth 3 -type f -print
          echo "===== MOD METADATA ====="
          for file in $(find source/XakaVisuals/src/main/resources -maxdepth 2 -type f -name 'fabric.mod.json'); do
            cat "$file"
          done
          echo "===== MIXIN CONFIG FILE LIST ====="
          find source/XakaVisuals/src/main/resources -type f -iname '*mixin*' -print
      - name: Build Fabric mod
        working-directory: source/XakaVisuals
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: XakaVisuals-Fabric-1.21.4
          path: source/XakaVisuals/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

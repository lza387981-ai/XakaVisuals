name: Build XakaVisuals.V2

on:
  workflow_dispatch:
  push:
    branches: [xakavisuals-v2]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build standalone V2
        run: gradle build
      - name: Upload V2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: XakaVisuals-V2
          path: build/libs/*-2.0.0.jar
          if-no-files-found: error

name: Build XakaVisuals # CI rebuild after marker compile fix

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Extract project archive
        run: unzip -q XakaVisuals-phone-build.zip -d source

      - name: Apply XakaVisuals source patches
        run: |
          cp patches/XakaVisualsScreen.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsScreen.java
          cp patches/XakaVisualsClient.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsClient.java
          cp patches/XakaVisualsMusic.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsMusic.java
          sed -i '/dependencies {/a\    include(implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4"))\n    include(implementation("com.googlecode.soundlibs:jlayer:1.0.1.4"))\n    include(implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4"))' source/XakaVisuals/build.gradle
          cp patches/XakaVisualsRenderer.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsRenderer.java
          cp patches/XakaVisualsSyncPayload.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsSyncPayload.java
          cp patches/XakaVisualsSync.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsSync.java
          cp patches/XakaVisualsSyncClient.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsSyncClient.java
          cp patches/XakaVisualsRemoteRenderer.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaVisualsRemoteRenderer.java
          cp patches/XakaHudPositionScreen.java source/XakaVisuals/src/main/java/dev/xaka/visuals/XakaHudPositionScreen.java
          mkdir -p source/XakaVisuals/src/main/java/dev/xaka/visuals/mixin
          cp patches/HeldItemRendererMixin.java source/XakaVisuals/src/main/java/dev/xaka/visuals/mixin/HeldItemRendererMixin.java
          cp patches/PlayerEntityModelMixin.java source/XakaVisuals/src/main/java/dev/xaka/visuals/mixin/PlayerEntityModelMixin.java
          cp patches/MainMenuBackgroundMixin.java source/XakaVisuals/src/main/java/dev/xaka/visuals/mixin/MainMenuBackgroundMixin.java
          cat > source/XakaVisuals/src/main/resources/xakavisuals.mixins.json <<'EOF'
          {
            "required": true,
            "package": "dev.xaka.visuals.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["HeldItemRendererMixin", "PlayerEntityModelMixin", "MainMenuBackgroundMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("source/XakaVisuals/src/main/resources/fabric.mod.json")
          data = json.loads(p.read_text())
          data["mixins"] = ["xakavisuals.mixins.json"]
          data["environment"] = "*"
          data.setdefault("entrypoints", {})["main"] = ["dev.xaka.visuals.XakaVisualsSync"]
          p.write_text(json.dumps(data, indent=2) + chr(10))
          PY

      - name: Generate XAKA logo texture
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import math
          out = Path("source/XakaVisuals/src/main/resources/assets/xakavisuals/textures/gui/xaka_logo.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          W, H = 512, 264
          scale = 2
          im = Image.new("RGBA", (W*scale, H*scale), (0,0,0,0))
          def font(size):
              return ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-BoldOblique.ttf", size*scale)
          def gradient_text(text, y, fnt, fill_top, fill_bottom, stroke=5):
              d = ImageDraw.Draw(im)
              box = d.textbbox((0,0), text, font=fnt, stroke_width=stroke*scale)
              tw, th = box[2]-box[0], box[3]-box[1]
              x = (im.width-tw)//2 - box[0]
              yy = y*scale - box[1]
              # violet glow behind the lettering
              glow = Image.new("RGBA", im.size, (0,0,0,0))
              gd = ImageDraw.Draw(glow)
              gd.text((x,yy), text, font=fnt, fill=(160,25,255,220), stroke_width=stroke*scale+5*scale, stroke_fill=(111,0,255,210))
              im.alpha_composite(glow.filter(ImageFilter.GaussianBlur(9*scale)))
              mask = Image.new("L", im.size, 0)
              md = ImageDraw.Draw(mask)
              md.text((x,yy), text, font=fnt, fill=255, stroke_width=stroke*scale, stroke_fill=255)
              d = ImageDraw.Draw(im)
              d.text((x,yy), text, font=fnt, fill=(10,4,24,255), stroke_width=stroke*scale+2*scale, stroke_fill=(22,5,52,255))
              grad = Image.new("RGBA", im.size, (0,0,0,0))
              pix = grad.load()
              for py in range(max(0,int(yy)), min(im.height,int(yy+th+4*scale))):
                  t = max(0,min(1,(py-yy)/max(1,th)))
                  col = tuple(int(fill_top[i]*(1-t)+fill_bottom[i]*t) for i in range(3))+(255,)
                  for px in range(max(0,int(x)), min(im.width,int(x+tw+4*scale))): pix[px,py]=col
              im.alpha_composite(Image.composite(grad, Image.new("RGBA", im.size, (0,0,0,0)), mask))
          # Crown emblem above the left side.
          crown = [(64,62),(78,20),(103,48),(130,8),(157,48),(184,20),(197,62),(190,78),(72,78)]
          crown = [(x*scale,y*scale) for x,y in crown]
          glow = Image.new("RGBA", im.size, (0,0,0,0)); gd=ImageDraw.Draw(glow)
          gd.polygon(crown, fill=(139,25,255,230), outline=(221,177,255,255), width=4*scale)
          im.alpha_composite(glow.filter(ImageFilter.GaussianBlur(8*scale)))
          d=ImageDraw.Draw(im); d.polygon(crown, fill=(91,13,191,255), outline=(223,190,255,255), width=3*scale)
          d.line([(82*scale,65*scale),(179*scale,65*scale)], fill=(245,226,255,255), width=4*scale)
          gradient_text("XAKA", 46, font(142), (255,255,255), (145,45,255), 5)
          gradient_text("VISUALS", 174, font(76), (255,255,255), (193,148,255), 3)
          d=ImageDraw.Draw(im)
          d.line([(96*scale,248*scale),(416*scale,248*scale)], fill=(151,45,255,255), width=5*scale)
          im.resize((W,H), Image.Resampling.LANCZOS).save(out)
          print(f"Generated {out} ({out.stat().st_size} bytes)")
          PY

      - name: Generate enemy target frame texture
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          out = Path("source/XakaVisuals/src/main/resources/assets/xakavisuals/textures/gui/target_frame.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          S = 512
          base = Image.new("RGBA", (S, S), (0,0,0,0))
          glow = Image.new("RGBA", (S, S), (0,0,0,0))
          def corner_paths(draw, color, width):
              # Four separate rounded L-shaped brackets with slim orbit accents.
              m, length = 72, 112
              paths = [
                  [(m+length,m),(m+18,m),(m,m+18),(m,m+length)],
                  [(S-m-length,m),(S-m-18,m),(S-m,m+18),(S-m,m+length)],
                  [(m,S-m-length),(m,S-m-18),(m+18,S-m),(m+length,S-m)],
                  [(S-m-length,S-m),(S-m-18,S-m),(S-m,S-m-18),(S-m,S-m-length)]
              ]
              for pts in paths:
                  draw.line(pts, fill=color, width=width, joint="curve")
                  # rounded endpoint dots make the corners feel polished
                  rr=width//2
                  for px,py in (pts[0],pts[-1]):
                      draw.ellipse((px-rr,py-rr,px+rr,py+rr), fill=color)
              orbit = [
                  ([(m+12,m+86),(m+30,m+36),(m+86,m+12)], 5),
                  ([(S-m-12,m+86),(S-m-30,m+36),(S-m-86,m+12)], 5),
                  ([(m+12,S-m-86),(m+30,S-m-36),(m+86,S-m-12)], 5),
                  ([(S-m-12,S-m-86),(S-m-30,S-m-36),(S-m-86,S-m-12)], 5)
              ]
              for pts,_ in orbit: draw.line(pts, fill=color, width=5, joint="curve")
          d=ImageDraw.Draw(glow)
          corner_paths(d,(255,255,255,190),48)
          base.alpha_composite(glow.filter(ImageFilter.GaussianBlur(25)))
          d=ImageDraw.Draw(base)
          corner_paths(d,(255,255,255,255),24)
          base.save(out)
          print(f"Generated {out} ({out.stat().st_size} bytes)")
          PY


      - name: Generate XAKA main menu background
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import random
          random.seed(44)
          W,H=1280,720
          im=Image.new("RGB",(W,H))
          px=im.load()
          for y in range(H):
              t=y/H
              c=(int(5+13*t),int(3+4*t),int(20+28*t))
              for x in range(W): px[x,y]=c
          haze=Image.new("RGBA",(W,H),(0,0,0,0)); hd=ImageDraw.Draw(haze)
          for x,y,r in [(210,170,180),(640,120,230),(1080,260,200),(640,430,260)]:
              hd.ellipse((x-r,y-r,x+r,y+r),fill=(117,28,226,48))
          im=Image.alpha_composite(im.convert("RGBA"),haze.filter(ImageFilter.GaussianBlur(70)))
          d=ImageDraw.Draw(im,"RGBA")
          for _ in range(260):
              x=random.randrange(W); y=random.randrange(500); r=random.choice([1,1,2])
              d.rectangle((x-r,y-r,x+r,y+r),fill=(226,198,255,random.randrange(90,220)))
          d.rectangle((1000,72,1118,190),fill=(197,153,255,210),outline=(245,225,255,255),width=5)
          d.rectangle((1020,92,1098,170),fill=(231,213,255,230))
          d.polygon([(0,450),(130,330),(230,410),(390,275),(530,420),(700,300),(850,425),(1010,300),(1160,410),(1280,335),(1280,720),(0,720)],fill=(28,9,61,255))
          d.polygon([(0,520),(170,410),(320,500),(480,380),(650,505),(820,390),(980,510),(1120,400),(1280,510),(1280,720),(0,720)],fill=(43,12,83,255))
          d.rectangle((430,300,850,565),fill=(15,6,34,255))
          for x,y,w,h in [(450,245,90,320),(550,205,100,360),(690,225,105,340),(795,275,55,290)]:
              d.rectangle((x,y,x+w,y+h),fill=(18,7,39,255),outline=(112,47,174,220),width=3)
              d.polygon([(x-12,y),(x+w//2,y-48),(x+w+12,y)],fill=(38,12,72,255),outline=(171,93,235,220))
          for x in range(470,820,55): d.rectangle((x,390,x+18,440),fill=(198,93,255,210))
          for x,y in [(85,395),(205,450),(1080,420),(1190,365)]:
              d.rectangle((x-9,y,x+9,y+145),fill=(20,8,31,255))
              for ox,oy,r in [(-35,-30,30),(0,-55,38),(34,-28,31),(-5,4,30)]:
                  d.rectangle((x+ox-r,y+oy-r,x+ox+r,y+oy+r),fill=(135,36,202,190),outline=(211,112,255,180),width=2)
          portal=Image.new("RGBA",(W,H),(0,0,0,0)); q=ImageDraw.Draw(portal)
          q.rectangle((1030,390,1210,635),fill=(5,2,18,255),outline=(171,75,255,255),width=16)
          q.rectangle((1052,412,1188,612),fill=(123,30,207,190))
          im=Image.alpha_composite(im,portal.filter(ImageFilter.GaussianBlur(28)))
          d=ImageDraw.Draw(im,"RGBA")
          d.rectangle((1030,390,1210,635),fill=(5,2,18,255),outline=(210,153,255,255),width=10)
          d.rectangle((1052,412,1188,612),fill=(102,20,177,190))
          d.rectangle((0,570,W,H),fill=(10,5,30,255))
          for y in range(585,710,17):
              x=random.randrange(0,850); length=random.randrange(80,390)
              d.line((x,y,min(W,x+length),y),fill=(161,74,242,random.randrange(35,120)),width=random.choice([1,2,3]))
          try: title=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf",126)
          except: title=ImageFont.load_default()
          glow=Image.new("RGBA",(W,H),(0,0,0,0)); gd=ImageDraw.Draw(glow)
          gd.text((W//2,205),"XAKA",font=title,anchor="mm",fill=(196,115,255,255),stroke_width=8,stroke_fill=(143,32,255,255))
          im=Image.alpha_composite(im,glow.filter(ImageFilter.GaussianBlur(22)))
          d=ImageDraw.Draw(im,"RGBA")
          d.text((W//2,205),"XAKA",font=title,anchor="mm",fill=(247,233,255,255),stroke_width=4,stroke_fill=(76,19,129,255))
          d.polygon([(565,118),(585,78),(615,108),(640,62),(665,108),(695,78),(715,118)],fill=(159,65,255,245),outline=(239,210,255,255))
          d.line((575,123,705,123),fill=(247,221,255,255),width=5)
          out=Path("source/XakaVisuals/src/main/resources/assets/xakavisuals/textures/gui/main_menu_bg.png")
          out.parent.mkdir(parents=True,exist_ok=True)
          im.convert("RGB").save(out,optimize=True)
          print(f"Generated {out} ({out.stat().st_size} bytes)")
          PY

      - name: Inspect project configuration
        run: |
          echo "===== BUILD FILE ====="
          sed -n '1,260p' source/XakaVisuals/build.gradle
          echo "===== RESOURCE FILE LIST ====="
          find source/XakaVisuals/src/main/resources -maxdepth 3 -type f -print
          echo "===== MOD METADATA ====="
          for file in $(find source/XakaVisuals/src/main/resources -maxdepth 2 -type f -name 'fabric.mod.json'); do
            cat "$file"
          done
          echo "===== MIXIN CONFIG FILE LIST ====="
          find source/XakaVisuals/src/main/resources -type f -iname '*mixin*' -print
      - name: Build Fabric mod
        working-directory: source/XakaVisuals
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: XakaVisuals-Fabric-1.21.4
          path: source/XakaVisuals/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

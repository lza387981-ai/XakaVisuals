name: Build XakaVisual.V2
on:
  push:
    branches: ['xakavisual-v2']
    paths: ['v2/**']
  pull_request:
    paths: ['v2/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build mod
        working-directory: v2
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: XakaVisual-V2-JAR
          path: v2/build/libs/*.jar
